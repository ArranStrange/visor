<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111" />
    <meta
      name="description"
      content="VISOR – A platform to share Lightroom presets, film simulations, and photographic inspiration."
    />
    <title>VISOR</title>

    <!--
      Static social-card defaults.

      These are what non-JS scrapers actually see. useDocumentMeta rewrites
      them per route once the app boots, but Facebook, Twitter/X, Slack,
      iMessage and LinkedIn do not run JavaScript — they fetch this file and
      stop. So a shared preset link previews with the site card below, not the
      preset's own photo. Per-recipe previews need prerendered HTML, which is
      deferred; see the follow-up issue.
    -->
    <link rel="canonical" href="https://visor-c51a1.web.app/" />
    <meta property="og:site_name" content="VISOR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="VISOR" />
    <meta
      property="og:description"
      content="VISOR – A platform to share Lightroom presets, film simulations, and photographic inspiration."
    />
    <meta property="og:url" content="https://visor-c51a1.web.app/" />
    <meta
      property="og:image"
      content="https://visor-c51a1.web.app/og-default.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="VISOR" />
    <meta
      name="twitter:description"
      content="VISOR – A platform to share Lightroom presets, film simulations, and photographic inspiration."
    />
    <meta
      name="twitter:image"
      content="https://visor-c51a1.web.app/og-default.png"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
