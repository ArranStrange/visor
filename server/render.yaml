services:
  - type: web
    name: visor-backend
    env: node
    rootDir: server
    buildCommand: cd /opt/render/project/src/server && npm install
    startCommand: cd /opt/render/project/src/server && npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
        # Format: mongodb+srv://username:<password>@cluster.mongodb.net/?retryWrites=true&w=majority
      - key: JWT_SECRET
        sync: false
      - key: PORT
        value: 10000
      # Base URL for links in transactional email. Without this, emailService
      # falls back to http://localhost:3000 and every verification and password
      # reset link sent from production is dead.
      - key: APP_URL
        value: https://visor-c51a1.web.app
      - key: RENDER_URL
        value: https://visor-backend.onrender.com
      # --- Email (SendGrid) ---
      - key: SENDGRID_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
